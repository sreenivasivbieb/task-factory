# Copy to factory.toml. CLI flags override these values.
seed = 0
workdir = "workdir"

[sandbox]
backend = "docker"        # "local" = no isolation, dev only
docker_binary = "docker"  # or "podman"
memory = "2g"
cpus = 2.0
pids_limit = 512
pin_base_image = true     # inspect records the base image by digest (name:tag@sha256:...)

[gates]
stability_repeats = 1     # use 3 for final runs
mutations = ["empty", "flip_comparison", "drop_error_branch"]
# full set: ["empty", "revert_half", "flip_comparison", "swap_arguments", "drop_error_branch", "hardcode_expected"]
max_known_failure_ratio = 0.2

[generation]
max_repairs = 3
max_touched_files = 6
overgeneration_factor = 3

# Optional: override what the inspector detects.
# [env]
# base_image = "python:3.12-slim"
