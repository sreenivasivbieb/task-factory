# Copy to factory.toml. CLI flags override these values.
seed = 0
workdir = "workdir"

[sandbox]
backend = "docker"        # "local" = no isolation, dev only
docker_binary = "docker"  # or "podman"
memory = "2g"
cpus = 2.0
pids_limit = 512
pin_base_image = true     # inspect records the base image by digest (name:tag@sha256:...)

[gates]
stability_repeats = 1     # use 3 for final runs
mutations = ["empty", "flip_comparison", "drop_error_branch"]
# full set: ["empty", "revert_half", "flip_comparison", "swap_arguments", "drop_error_branch", "hardcode_expected"]
max_known_failure_ratio = 0.2

[harness]
k = 1                     # attempts per task
workers = 1               # attempts at the same time (more = faster, more quota errors on free models)
egress = "allowlist"      # the agent's sandbox reaches only allowed_hosts; "open" = the whole internet
# allowed_hosts = ["opencode.ai", "*.opencode.ai", "integrate.api.nvidia.com", "api.tokenrouter.com",
#                  "openrouter.ai", "api.anthropic.com", "api.openai.com", "api.groq.com",
#                  "bedrock-runtime.*.amazonaws.com"]

