[project]
name = "task-factory"
version = "0.1.0"
description = "Turns a software repository into validated coding tasks for evaluating AI coding systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",  # MIT
    "pymongo>=4.8,<5",
    "rich>=13,<15",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]  # MIT; the MCP server for Claude Code (factory-mcp); 2.x renamed FastMCP

[project.scripts]
factory = "factory.cli:main"
task-factory = "factory.cli:main"
factory-mcp = "factory.mcp_server:main"

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=8",  # MIT
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
    "slow: slow tests or tests that call a real LLM (deselect with -m 'not slow')",
    "docker: tests that need a working Docker daemon",
]
